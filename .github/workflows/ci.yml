name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs on the same branch/PR when a new commit arrives.
# Saves CI minutes and gives faster feedback on the latest code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check app tests

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hirearchy
          POSTGRES_PASSWORD: hirearchy_test_password
          POSTGRES_DB: hirearchy_test
        ports:
          - 5432:5432
        # Wait until Postgres is actually accepting connections before tests run.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: Hirearchy
      APP_VERSION: 0.1.0
      ENVIRONMENT: test
      POSTGRES_USER: hirearchy
      POSTGRES_PASSWORD: hirearchy_test_password
      POSTGRES_DB: hirearchy_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 10080
      UPLOAD_DIR: /tmp/hirearchy_test_uploads
      MAX_RESUME_SIZE_BYTES: 5242880

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Only build on pushes to main, not on every PR — saves CI minutes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max