[project]
name = "hirearchy-backend"
version = "0.1.0"
description = "Hirearchy backend — job search intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends/Query/File are *meant* to be called in argument defaults.
#        Ruff doesn't know about FastAPI's DI, so this rule is a false positive for us.
# B904: We raise HTTPException inside except blocks deliberately; chaining isn't required
#        for API error translation. Deferred to a future cleanup pass.
ignore = ["B008", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"